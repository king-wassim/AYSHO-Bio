# ==========================================================================
# AYSHO - Production Compose (OVHcloud VPS)
#
# Services: nginx (frontend + reverse proxy), strapi, postgres
# Networks: frontend-network (nginx + strapi), backend-network (strapi + postgres)
# Only nginx publishes ports to the host (80/443).
# ==========================================================================

name: aysho

services:
  # --------------------------------------------------------------------------
  # Nginx : public entry point, static React SPA, reverse proxy for Strapi
  # --------------------------------------------------------------------------
  nginx:
    image: ghcr.io/${GHCR_OWNER}/aysho-frontend:${IMAGE_TAG:-latest}
    container_name: aysho-nginx
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STRAPI_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AYSHO_DOMAIN: ${AYSHO_DOMAIN:-aysho.tn}
    volumes:
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-challenges:/var/www/certbot
    networks:
      - frontend-network
    depends_on:
      - strapi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # Strapi : backend API + admin. NOT exposed to the host.
  # Connected to both networks (frontend-network via nginx, backend-network via postgres)
  # --------------------------------------------------------------------------
  strapi:
    image: ghcr.io/${GHCR_OWNER}/aysho-backend:${IMAGE_TAG:-latest}
    container_name: aysho-strapi
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Database (Docker network, never published)
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-aysho}
      DATABASE_USERNAME: ${POSTGRES_USER:-aysho}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      # Frontend (CORS) - same-origin via nginx, kept strict
      FRONTEND_URL: https://aysho.tn
      # Public URL: tells Strapi the external URL it is served at (needed for
      # admin panel asset paths when behind a reverse proxy).
      PUBLIC_URL: https://aysho.tn
      # Cloudinary - the only media provider in production
      UPLOAD_PROVIDER: cloudinary
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-aysho}
      # Sentry (optional)
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      # Resend email notifications (new order alerts)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-on@resend.dev}
      RESEND_TO: ${RESEND_TO}
      # Rate limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    networks:
      - frontend-network
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1337/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # PostgreSQL : private database, only on backend-network
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aysho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aysho}
      POSTGRES_USER: ${POSTGRES_USER:-aysho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aysho} -d ${POSTGRES_DB:-aysho}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Keep memory/shared buffers reasonable for a 4 GB VPS
    shm_size: "128mb"

volumes:
  postgres-data:
  certbot-certs:
  certbot-challenges:

networks:
  frontend-network:
    name: frontend-network
  backend-network:
    name: backend-network