name: CD - Build, Push & Deploy to Production VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # BUILD & PUSH DOCKER IMAGES TO GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      owner: ${{ steps.set-tag.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR requires lowercase image names.
      # github.repository_owner may contain uppercase letters.
      - name: Compute lowercase owner and image tag
        id: set-tag
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # FRONTEND
      # ------------------------------------------------------------------
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.set-tag.outputs.owner }}/aysho-frontend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # BACKEND
      # ------------------------------------------------------------------
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.set-tag.outputs.owner }}/aysho-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # DEPLOY TO VPS VIA SSH
  # ==========================================
  deploy:
    name: Deploy to VPS (aysho.tn)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          envs: DEPLOY_SHA,GHCR_OWNER
          script: |
            set -euo pipefail
            cd /opt/aysho
            git pull --ff-only || true
            export IMAGE_TAG="sha-${DEPLOY_SHA}"
            export GHCR_OWNER="${GHCR_OWNER}"
            bash deploy/scripts/deploy.sh
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.owner }}

  # ==========================================
  # SMOKE TESTS AGAINST PRODUCTION
  # ==========================================
  smoke-tests:
    name: Smoke Tests (production)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for services to stabilise
        run: sleep 15

      - name: Test frontend health
        run: |
          curl -fsS https://aysho.tn/health || exit 1
          curl -fsS https://aysho.tn/ || exit 1

      - name: Test backend health (via nginx)
        run: |
          curl -fsS https://aysho.tn/api/health || exit 1

      - name: Test API endpoints (read-only)
        run: |
          curl -fsS https://aysho.tn/api/categories || exit 1
          curl -fsS https://aysho.tn/api/products || exit 1
