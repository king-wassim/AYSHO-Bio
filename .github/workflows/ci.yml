name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  # ==========================================
  # LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install pnpm first. Version is pinned here only — no packageManager
      # field in root package.json to avoid "multiple versions" warning.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: ./frontend
        run: pnpm run lint

      - name: Frontend type check
        working-directory: ./frontend
        run: pnpm run typecheck

      - name: Install backend dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Backend lint
        working-directory: ./backend
        run: pnpm run lint

      - name: Backend type check
        working-directory: ./backend
        run: pnpm exec tsc --noEmit

      - name: Backend build (strapi)
        working-directory: ./backend
        run: pnpm run build

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests (vitest)
        working-directory: ./frontend
        # --passWithNoTests: exit 0 when no test files exist yet.
        # Remove once test files are added to the project.
        run: pnpm run test -- --passWithNoTests

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin to commit SHA (57a97c7e) = safe v0.35.0 post-compromise.
      # The March 2026 supply chain incident (GHSA-69fq-xp46-6x23) force-pushed
      # 76 of 77 version tags; only 0.35.0 / this SHA was confirmed safe.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e440ef463bc38c3c41eb2c3a52d5e42f8
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # CodeQL v4 — v3 deprecated as of Oct 2025
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Setup pnpm (for audit)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js (for audit)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: pnpm audit --audit-level=high || true

      - name: Audit backend dependencies
        working-directory: ./backend
        run: pnpm audit --audit-level=high || true

  # ==========================================
  # DOCKER BUILD VERIFICATION
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, frontend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ghcr.io/aysho/aysho-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ghcr.io/aysho/aysho-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend image (health endpoint)
        run: |
          docker run --rm -d --name frontend-test -p 8080:80 ghcr.io/aysho/aysho-frontend:test
          sleep 5
          curl -fsS http://localhost:8080/health || exit 1
          docker stop frontend-test

      - name: Test backend image (boot + health)
        run: |
          docker run --rm -d --name backend-test -p 1337:1337 \
            --network host \
            -e DATABASE_CLIENT=postgres \
            -e DATABASE_HOST=localhost \
            -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=strapi_test \
            -e DATABASE_USERNAME=strapi \
            -e DATABASE_PASSWORD=strapi \
            -e DATABASE_SSL=false \
            -e JWT_SECRET=test-secret-32-chars-minimum-ok \
            -e ADMIN_JWT_SECRET=test-secret-32-chars-minimum-ok \
            -e API_TOKEN_SALT=test-secret-32-chars-minimum-ok \
            -e TRANSFER_TOKEN_SALT=test-salt-32-chars-minimum-ok \
            -e APP_KEYS=test-key-1,test-key-2,test-key-3,test-key-4 \
            -e ENCRYPTION_KEY=test-encryption-key-32-chars-long \
            ghcr.io/aysho/aysho-backend:test
          timeout 120 bash -c 'until curl -fsS http://localhost:1337/api/health; do sleep 2; done'
          docker stop backend-test
