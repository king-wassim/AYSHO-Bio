name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================
  # LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend type check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend lint
        working-directory: ./backend
        run: npm run lint

      - name: Backend type check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Backend build (strapi)
        working-directory: ./backend
        run: npm run build

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests (vitest)
        working-directory: ./frontend
        run: npm run test

  # ==========================================
  # DOCKER BUILD VERIFICATION
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, frontend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ghcr.io/aysho/aysho-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ghcr.io/aysho/aysho-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend image (health endpoint)
        run: |
          docker run --rm -d --name frontend-test -p 8080:80 ghcr.io/aysho/aysho-frontend:test
          sleep 5
          curl -fsS http://localhost:8080/health || exit 1
          docker stop frontend-test

      - name: Test backend image (boot + health)
        run: |
          docker run --rm -d --name backend-test -p 1337:1337 \
            --network host \
            -e DATABASE_CLIENT=postgres \
            -e DATABASE_HOST=localhost \
            -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=strapi_test \
            -e DATABASE_USERNAME=strapi \
            -e DATABASE_PASSWORD=strapi \
            -e DATABASE_SSL=false \
            -e JWT_SECRET=test-secret \
            -e ADMIN_JWT_SECRET=test-secret \
            -e API_TOKEN_SALT=test-secret \
            -e TRANSFER_TOKEN_SALT=test-secret \
            -e APP_KEYS=test,test,test,test \
            -e ENCRYPTION_KEY=test-encryption-key-32-chars \
            ghcr.io/aysho/aysho-backend:test
          timeout 120 bash -c 'until curl -fsS http://localhost:1337/api/health; do sleep 2; done'
          docker stop backend-test

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Audit npm dependencies
        run: |
          cd frontend && npm audit --audit-level=high || true
          cd ../backend && npm audit --audit-level=high || true