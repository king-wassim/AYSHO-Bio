name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --workspaces=false || true

      # Frontend lint
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type check
        working-directory: ./frontend
        run: npm run typecheck

      # Backend lint
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend lint
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type check
        working-directory: ./backend
        run: npx tsc --noEmit

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./frontend/coverage
          flags: frontend

  # ==========================================
  # BACKEND TESTS
  # ==========================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_test
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: 'false'
      NODE_ENV: test
      JWT_SECRET: test-secret
      ADMIN_JWT_SECRET: test-secret
      API_TOKEN_SALT: test-secret
      TRANSFER_TOKEN_SALT: test-secret
      APP_KEYS: test,test,test,test
      ENCRYPTION_KEY: test-encryption-key-32-chars!!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run database migrations
        working-directory: ./backend
        run: npm run db:migrate || true

      - name: Run backend tests
        working-directory: ./backend
        run: npm run test --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./backend/coverage
          flags: backend

  # ==========================================
  # DOCKER BUILD VERIFICATION
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, frontend-test, backend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Frontend build
      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend build
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test frontend image
      - name: Test frontend image
        run: |
          docker run --rm -d --name frontend-test -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop frontend-test

      # Test backend image
      - name: Test backend image
        env:
          DATABASE_CLIENT: postgres
          DATABASE_URL: postgresql://strapi:strapi@localhost:5432/strapi_test?sslmode=disable
          FRONTEND_URL: http://localhost:5173
          JWT_SECRET: test-secret
          ADMIN_JWT_SECRET: test-secret
          API_TOKEN_SALT: test-secret
          TRANSFER_TOKEN_SALT: test-secret
          APP_KEYS: test,test,test,test
          ENCRYPTION_KEY: test-encryption-key-32-chars!!
          NODE_ENV: production
        run: |
          docker run --rm -d --name backend-test -p 1337:1337 \
            -e DATABASE_CLIENT=postgres \
            -e DATABASE_URL=postgresql://strapi:strapi@host.docker.internal:5432/strapi_test?sslmode=disable \
            -e FRONTEND_URL=http://localhost:5173 \
            -e JWT_SECRET=test-secret \
            -e ADMIN_JWT_SECRET=test-secret \
            -e API_TOKEN_SALT=test-secret \
            -e TRANSFER_TOKEN_SALT=test-secret \
            -e APP_KEYS=test,test,test,test \
            -e ENCRYPTION_KEY=test-encryption-key-32-chars!! \
            -e NODE_ENV=production \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          sleep 20
          curl -f http://localhost:1337/api/health || exit 1
          docker stop backend-test

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Audit npm dependencies
        run: |
          cd frontend && npm audit --audit-level=high || true
          cd ../backend && npm audit --audit-level=high || true

  # ==========================================
  # DEPLOY PREVIEW (for PRs)
  # ==========================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint, frontend-test, backend-test, docker-build, security]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy frontend preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: aysho-preview
          directory: ./frontend
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: preview-${{ github.event.pull_request.number }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment ready!\nFrontend: https://preview-${{ github.event.pull_request.number }}.aysho.pages.dev'
            })

  # ==========================================
  # FINAL STATUS
  # ==========================================
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, frontend-test, backend-test, docker-build, security]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then exit 1; fi
          echo "All checks passed! ✅"