# ==========================================================================
# AYSHO - Production Nginx configuration
# Serves the React SPA, proxies Strapi (/api, /admin, /uploads), terminates TLS
# ==========================================================================

# Main config tweaks (inherited from nginx base image)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    client_max_body_size 12m;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/xml application/json application/rss+xml image/svg+xml
               font/woff2 font/woff;

    # Serve precompressed .gz assets if present (dist/*.gz produced by Vite)
    gzip_static on;

    # Security headers (global)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # HTTP :80  -> always redirect to HTTPS, except ACME challenge
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name aysho.tn www.aysho.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container-level healthcheck (no TLS on :80)
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS :443
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name aysho.tn www.aysho.tn;

        ssl_certificate /etc/letsencrypt/live/aysho.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aysho.tn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;
        # Docker internal DNS resolver — REQUIRED to resolve container names dynamically.
        # Without this, nginx resolves "strapi" once at startup and caches the IP forever.
        # When strapi is recreated (new IP), nginx keeps the stale IP → 502.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Use a variable for upstream so nginx re-resolves on every request
        set $strapi_upstream http://strapi:1337;

        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck for monitoring / load-balancer / uptime checks
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        # Strapi API reverse proxy (same-origin)
        # https://aysho.tn/api/...  ->  http://strapi:1337/api/...
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass $strapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ------------------------------------------------------------------
        # Strapi Admin
        # https://aysho.tn/admin  ->  http://strapi:1337/admin
        # The trailing slash variants and the asset requests from the admin
        # SPA (/_strapi, /_plugin, etc.) are all proxied here.
        # ------------------------------------------------------------------
        location /admin {
            proxy_pass $strapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # Strapi admin static assets (chunks, icons, etc. served by Strapi itself)
        location ~* ^/(_strapi|_plugin|build)/ {
            proxy_pass $strapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ------------------------------------------------------------------
        # Strapi local uploads (only used if provider is local; in
        # production Cloudinary is used, this is kept for safety)
        # ------------------------------------------------------------------
        location /uploads/ {
            proxy_pass $strapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Fingerprinted static assets -> long cache (React SPA only)
        # IMPORTANT: This block must come AFTER all Strapi proxy locations.
        # Strapi admin assets (strapi-*.js, strapi-*.css, chunks) are served
        # by Strapi itself — they must NOT be caught here.
        # ------------------------------------------------------------------

        # Strapi admin JS/CSS assets — served by Strapi, not from nginx disk.
        # These are fingerprinted files at the root level (e.g. /strapi-Xxxx.js).
        location ~* ^/strapi- {
            proxy_pass $strapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # All other fingerprinted assets (React SPA) — served from disk.
        # If the file doesn't exist on disk (e.g. Strapi admin chunks like
        # App-Xxxxx.js, Login-Xxxxx.js), fall back to Strapi upstream.
        location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            # Try disk first; if not found, proxy to Strapi (admin chunks)
            try_files $uri @strapi_assets;
        }

        # Fallback: asset not on disk → must be a Strapi admin chunk
        location @strapi_assets {
            proxy_pass $strapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # React SPA with Client-Side Routing
        # ------------------------------------------------------------------
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://res.cloudinary.com https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            try_files $uri $uri/ /index.html;
        }

        # index.html -> no-cache so new releases are picked up immediately
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://res.cloudinary.com https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            expires -1;
        }
    }
}