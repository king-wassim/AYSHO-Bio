# ==========================================================================
# AYSHO - Production Nginx configuration
# ==========================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 12m;

    # ------------------------------------------------------------------
    # Upstream block — required so named locations (@) can proxy_pass
    # without the "variable upstream" restriction.
    # Docker DNS (127.0.0.11) re-resolves the name on each health check.
    # ------------------------------------------------------------------
    upstream strapi_backend {
        server strapi:1337;
        keepalive 16;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/xml application/json application/rss+xml image/svg+xml
               font/woff2 font/woff;
    gzip_static on;

    # Security headers (global)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # HTTP :80 -> redirect to HTTPS (except ACME challenge)
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name aysho.tn www.aysho.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS :443
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name aysho.tn www.aysho.tn;

        ssl_certificate /etc/letsencrypt/live/aysho.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aysho.tn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 127.0.0.11 valid=10s ipv6=off;

        add_header Strict-Transport-Security "max-age=15552000" always;
        # X-Frame-Options and CSP are set per-location, not globally,
        # so Strapi admin headers are not overridden by nginx.

        root /usr/share/nginx/html;
        index index.html;

        # Health check
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        # Strapi API
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ------------------------------------------------------------------
        # Strapi Admin panel
        # ------------------------------------------------------------------
        location /admin {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # Strapi uploads
        # ------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Strapi admin JS entry point served at root level.
        # Strapi v5 places its main bundle at /strapi-Xxxx.js.
        # ^~ wins over regex blocks → always proxied to Strapi.
        # ------------------------------------------------------------------
        location ^~ /strapi- {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Static assets (React SPA) — long cache
        # JS/CSS not found on disk → @strapi_chunk (Strapi admin chunks
        # like App-Xxx.js, Login-Xxx.js that also land at root level).
        # ------------------------------------------------------------------
        location ~* \.(js|css|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri @strapi_chunk;
        }

        location ~* \.(png|jpe?g|gif|svg|ico|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Named location — can use upstream block without restriction
        location @strapi_chunk {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # React SPA fallback
        # ------------------------------------------------------------------
        location / {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://res.cloudinary.com https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://res.cloudinary.com https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            expires -1;
        }
    }
}
