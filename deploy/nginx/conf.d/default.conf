# ==========================================================================
# AYSHO - Production Nginx configuration
# Serves the React SPA, proxies Strapi (/api, /admin, /uploads), terminates TLS
# ==========================================================================

# Main config tweaks (inherited from nginx base image)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    client_max_body_size 12m;

    # Upstream block — allows named locations to proxy_pass without variable restriction
    upstream strapi_backend {
        server strapi:1337;
        keepalive 16;
    }

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/xml application/json application/rss+xml image/svg+xml
               font/woff2 font/woff;

    # Serve precompressed .gz assets if present (dist/*.gz produced by Vite)
    gzip_static on;

    # Security headers (global)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # HTTP :80  -> always redirect to HTTPS, except ACME challenge
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name aysho.tn www.aysho.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container-level healthcheck (no TLS on :80)
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS :443
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name aysho.tn www.aysho.tn;

        ssl_certificate /etc/letsencrypt/live/aysho.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aysho.tn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;
        # Docker internal DNS resolver — still needed for ssl_stapling
        resolver 127.0.0.11 valid=10s ipv6=off;

        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck for monitoring / load-balancer / uptime checks
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        # Strapi API reverse proxy (same-origin)
        # https://aysho.tn/api/...  ->  http://strapi:1337/api/...
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ------------------------------------------------------------------
        # Strapi Admin
        # https://aysho.tn/admin  ->  http://strapi:1337/admin
        # The trailing slash variants and the asset requests from the admin
        # SPA (/_strapi, /_plugin, etc.) are all proxied here.
        # proxy_intercept_errors off ensures nginx never substitutes its own
        # index.html for Strapi responses.
        # ------------------------------------------------------------------
        location /admin {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
            proxy_intercept_errors off;
            # Do NOT use try_files here — must never fall back to React index.html
        }

        # Strapi admin static assets (chunks, icons, etc. served by Strapi itself)
        location ~* ^/(_strapi|_plugin|build)/ {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ------------------------------------------------------------------
        # Strapi local uploads (only used if provider is local; in
        # production Cloudinary is used, this is kept for safety)
        # ------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Fingerprinted static assets
        # React assets exist on disk → served locally with long cache.
        # Strapi admin assets do NOT exist on disk → proxied to Strapi.
        # We use error_page 404 to route missing files to Strapi.
        # ------------------------------------------------------------------
        location ~* \.(js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            # If file exists on disk (React build), serve it directly.
            # If not (Strapi admin chunk), return 404 which triggers @strapi_assets.
            error_page 404 = @strapi_assets;
            log_not_found off;
            try_files $uri =404;
        }

        # Named location: proxy asset requests that were not found on disk to Strapi
        location @strapi_assets {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ------------------------------------------------------------------
        # React SPA with Client-Side Routing
        # ------------------------------------------------------------------
        location / {
            # CSP for the React frontend only — NOT applied to /admin (proxied separately)
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://res.cloudinary.com https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            try_files $uri $uri/ /index.html;
        }

        # index.html -> no-cache so new releases are picked up immediately
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://res.cloudinary.com https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            expires -1;
        }
    }
}
